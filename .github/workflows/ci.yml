name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          mapfile -d '' gofiles < <(git ls-files -z '*.go')
          files=$(gofmt -l "${gofiles[@]}")
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Test release API reconciliation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify module integrity
        run: go mod verify
      - name: Check module tidiness
        run: go mod tidy -diff

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      VIFF_SHOTS: ${{ github.workspace }}/.viff-test/ci/screenshots
      VIFF_SHOTS_BY_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux runtime and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libxcb1 libcairo2 libfontconfig1 libfreetype6 libharfbuzz0b libpango-1.0-0 libpangocairo-1.0-0 fonts-dejavu-core
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: |
          if [ ! -f '/c/Program Files (x86)/NSIS/makensis.exe' ]; then
            choco install nsis --yes --no-progress
          fi
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
      - name: Record environment
        run: |
          mkdir -p .viff-test/ci/logs
          go version
          git --version
          # Windows' inherited TEMP can contain a DOS 8.3 alias (RUNNER~1),
          # while Git reports the long path. Use the runner's temp root.
          printf 'TEMP=%s\nTMP=%s\nTMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Vet all code, including headless tests
        run: go vet -tags 'vivahead litheaudit' ./...
      - name: Test domain, Git, storage, and workspace
        run: go test -json -count=1 -timeout=10m ./... > .viff-test/ci/logs/core.jsonl
      - name: Test UI without opening windows
        run: go test -json -count=1 -timeout=15m -tags 'vivahead litheaudit' ./internal/ui > .viff-test/ci/logs/ui.jsonl
      - name: Build
        run: |
          mkdir -p build
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -trimpath -ldflags="-s -w -H=windowsgui" -o build/viff.exe ./cmd/viff
          elif [ "$RUNNER_OS" = macOS ]; then
            CGO_CFLAGS="-mmacosx-version-min=13.0" CGO_LDFLAGS="-mmacosx-version-min=13.0" MACOSX_DEPLOYMENT_TARGET=13.0 go build -trimpath -ldflags="-s -w" -o build/viff ./cmd/viff
          else
            go build -trimpath -ldflags="-s -w" -o build/viff ./cmd/viff
          fi
      - name: Package and check installation without opening windows
        run: python scripts/package.py v0.1.0-ci --smoke
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-${{ matrix.os }}
          path: .viff-test/ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  required:
    name: CI
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          TEST: ${{ needs.test.result }}
        run: test "$QUALITY" = success && test "$TEST" = success
