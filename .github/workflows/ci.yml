name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pull requests only need the newest commit verified, so superseded runs are
# cancelled. Runs on main are never cancelled: the release workflow requires a
# successful CI run for the exact commit that gets tagged.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Documentation-only pull requests skip the heavy jobs. This job always runs
  # so the required "CI" check still appears and turns green instead of staying
  # pending forever (a skipped required check would block merging).
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only || 'false' }}
    steps:
      - name: Check out pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classify pull request changes
        id: classify
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD)
          docs_only=true
          if [ "${#changed[@]}" -eq 0 ]; then
            docs_only=false
          fi
          for file in "${changed[@]}"; do
            case "$file" in
              README.md | README.zh-CN.md | CONTRIBUTING.md | SECURITY.md | \
                THIRD_PARTY_NOTICES.md | LICENSE | docs/*) ;;
              *) docs_only=false ;;
            esac
          done
          printf 'Changed files:\n  %s\n' "$(printf '%s\n' "${changed[@]:-}" | paste -sd ' ' -)"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          mapfile -d '' gofiles < <(git ls-files -z '*.go')
          files=$(gofmt -l "${gofiles[@]}")
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Validate curated release notes
        run: python3 scripts/release_notes.py
      - name: Test release API reconciliation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify module integrity
        run: go mod verify
      - name: Check module tidiness
        run: go mod tidy -diff

  # Domain, Git, storage, workspace and packaging checks for every supported
  # OS. Build and package stay here so installers are still verified per OS.
  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      VIFF_SHOTS: ${{ github.workspace }}/.viff-test/ci/shots
      VIFF_SHOTS_BY_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux runtime and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libxcb1 libcairo2 libfontconfig1 libfreetype6 libharfbuzz0b libpango-1.0-0 libpangocairo-1.0-0 fonts-dejavu-core
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: |
          if [ ! -f '/c/Program Files (x86)/NSIS/makensis.exe' ]; then
            choco install nsis --yes --no-progress
          fi
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
      - name: Record environment
        run: |
          mkdir -p .viff-test/ci/logs
          go version
          git --version
          # Windows' inherited TEMP can contain a DOS 8.3 alias (RUNNER~1),
          # while Git reports the long path. Use the runner's temp root.
          printf 'TEMP=%s\nTMP=%s\nTMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Vet all code, including headless tests
        run: go vet -tags 'vivahead litheaudit' ./...
      - name: Test domain, Git, storage, and workspace
        run: go test -json -count=1 -timeout=10m ./... > .viff-test/ci/logs/core.jsonl
      - name: Build
        run: |
          mkdir -p build
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -trimpath -ldflags="-s -w -H=windowsgui" -o build/viff.exe ./cmd/viff
          elif [ "$RUNNER_OS" = macOS ]; then
            CGO_CFLAGS="-mmacosx-version-min=13.0" CGO_LDFLAGS="-mmacosx-version-min=13.0" MACOSX_DEPLOYMENT_TARGET=13.0 go build -trimpath -ldflags="-s -w" -o build/viff ./cmd/viff
          else
            go build -trimpath -ldflags="-s -w" -o build/viff ./cmd/viff
          fi
      - name: Package and check installation without opening windows
        run: python scripts/package.py v0.1.0-ci --smoke
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-${{ matrix.os }}-core
          path: .viff-test/ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # The headless UI suite is the longest step, so it is sharded across runners
  # and no longer sits on the critical path. Every test still runs exactly once
  # per OS; the shard action splits the test list by index.
  ui:
    name: UI (${{ matrix.os }} shard ${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      VIFF_SHOTS: ${{ github.workspace }}/.viff-test/ci/shots
      VIFF_SHOTS_BY_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libxcb1 libcairo2 libfontconfig1 libfreetype6 libharfbuzz0b libpango-1.0-0 libpangocairo-1.0-0 fonts-dejavu-core
      - name: Record environment
        run: |
          mkdir -p .viff-test/ci/logs
          go version
          git --version
          printf 'TEMP=%s\nTMP=%s\nTMPDIR=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Test UI without opening windows
        uses: ./.github/actions/go-test-shard
        with:
          packages: ./internal/ui
          tags: vivahead litheaudit
          shard: ${{ matrix.shard }}
          shards: 2
          timeout: 10m
          log-file: .viff-test/ci/logs/ui-${{ matrix.shard }}.jsonl
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-${{ matrix.os }}-ui-${{ matrix.shard }}
          path: .viff-test/ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  required:
    name: CI
    if: always()
    needs: [changes, quality, test, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require every check to pass
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          CHANGES: ${{ needs.changes.result }}
          QUALITY: ${{ needs.quality.result }}
          TEST: ${{ needs.test.result }}
          UI: ${{ needs.ui.result }}
        run: |
          set -euo pipefail
          test "$CHANGES" = success
          if [ "$DOCS_ONLY" = "true" ]; then
            # Documentation-only pull request: the heavy jobs are skipped on
            # purpose, so the required check passes without running them.
            test "$QUALITY" = skipped
            test "$TEST" = skipped
            test "$UI" = skipped
          else
            test "$QUALITY" = success
            test "$TEST" = success
            test "$UI" = success
          fi
