name: 功能建议 / Feature request
description: 建议新功能或改进（中文或英文均可）/ Suggest a feature or improvement (Chinese or English welcome)
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        中文或英文都可以。Chinese or English is welcome.

        Viff 的功能范围与阶段见 [设计文档](https://github.com/1lck/viff/blob/main/docs/design.md)，已知限制见 [README](https://github.com/1lck/viff#readme)。**安全问题请走私密报告**，不要在这里提交。
        See the [design document](https://github.com/1lck/viff/blob/main/docs/design.md) for scope and the [README](https://github.com/1lck/viff#readme) for known limitations. **Security issues belong in private reporting**, not here.

  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / Problem or use case
      description: 你正在做什么？现在的哪里不够用？ / What are you trying to do, and what falls short today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed solution
      description: 描述期望的行为；如果参照其他 Git 客户端，请说明具体交互 / Describe the expected behaviour; if you are modelling it on another Git client, describe the interaction
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives considered
      description: 目前你怎么绕过这个问题？ / How do you work around it today?

  - type: dropdown
    id: area
    attributes:
      label: 涉及区域 / Area
      description: 可多选 / Select all that apply
      multiple: true
      options:
        - 欢迎页与仓库 / Welcome and repositories
        - Commit 与 ChangeList / Commit and ChangeList
        - Diff 与冲突 / Diff and conflicts
        - Log 与历史操作 / Log and history rewriting
        - 分支、标签与远程 / Branches, tags and remotes
        - Stash 与补丁 / Stash and patches
        - Worktree 与子模块 / Worktrees and submodules
        - 设置、主题与快捷键 / Settings, themes and shortcuts
        - 其他 / Other

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: 我已经搜索过现有 Issue 和文档。 / I searched existing issues and the documentation.
          required: true
        - label: 这不是安全漏洞报告。 / This is not a security vulnerability report.
          required: true
